services:
  mcp-connector:
    image: ${MCP_CONNECTOR_IMAGE:-dofe/mcp-connector:local}
    build:
      context: ../..
      dockerfile: deploy/mcp-connector/Dockerfile
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      MCP_CONNECTOR_HOST: 0.0.0.0
      MCP_CONNECTOR_PORT: ${MCP_CONNECTOR_PORT:-8787}
      MCP_CONNECTOR_AUTH_TOKEN: ${MCP_CONNECTOR_AUTH_TOKEN:?set MCP_CONNECTOR_AUTH_TOKEN}
      MCP_CONNECTOR_TIMEOUT_MS: ${MCP_CONNECTOR_TIMEOUT_MS:-120000}
      MCP_CONNECTOR_NETWORK_MODE: ${MCP_CONNECTOR_NETWORK_MODE:-open}
      MCP_CONNECTOR_ALLOWED_HOSTS: ${MCP_CONNECTOR_ALLOWED_HOSTS:-}
      MCP_EGRESS_PROXY_URL: ${MCP_EGRESS_PROXY_URL:-}
    networks:
      - mcp-egress
    ports:
      - "127.0.0.1:${MCP_CONNECTOR_PORT:-8787}:8787"

networks:
  mcp-egress:
    name: ${MCP_CONNECTOR_NETWORK:-dofe-mcp-egress}
    driver: bridge
