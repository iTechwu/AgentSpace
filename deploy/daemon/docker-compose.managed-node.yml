services:
  managed-node:
    build:
      context: ../..
      dockerfile: deploy/daemon/Dockerfile.managed-node
    image: dofe-agent-managed-node:local
    platform: linux/amd64
    env_file: ${MANAGED_NODE_ENV_FILE:-./.env.managed-node}
    environment:
      DOFE_AGENT_DAEMON_STATE_DIR: ${MANAGED_NODE_STATE_DIR:?Set MANAGED_NODE_STATE_DIR to an absolute host path}
      DOFE_AGENT_SKILL_SERVICE_SECRET_ROOT: ${MANAGED_NODE_STATE_DIR:?Set MANAGED_NODE_STATE_DIR to an absolute host path}/skill-service-secrets
      DOFE_AGENT_SKILL_SERVICE_NETWORK_POLICY_ROOT: ${MANAGED_NODE_STATE_DIR:?Set MANAGED_NODE_STATE_DIR to an absolute host path}/skill-service-network-policies
      DOFE_AGENT_MANAGED_NODE: "true"
      DOFE_AGENT_RUNTIME_APP_COMMAND_TIMEOUT_MS: ${DOFE_AGENT_RUNTIME_APP_COMMAND_TIMEOUT_MS:-600000}
      NODE_EXTRA_CA_CERTS: ${MANAGED_NODE_TLS_CA_PATH:+/run/dofe-agent-tls-ca.pem}
      # MCP egress enforcement. When true the entrypoint reconciles DOCKER-USER
      # rules before dropping privileges and starting the managed node daemon.
      # Defaults to canary until daemon/Provider process-isolation probes pass.
      MCP_EGRESS_ENFORCE: ${MCP_EGRESS_ENFORCE:-false}
      MCP_EGRESS_PROXY_URL: ${MCP_EGRESS_PROXY_URL:?Set MCP_EGRESS_PROXY_URL to the proxy runtime-network IP}
      MCP_EGRESS_PROXY_ADMIN_TOKEN: ${MCP_EGRESS_PROXY_ADMIN_TOKEN:?Set the active MCP egress proxy admin token}
      RUNTIME_SUBNET: ${RUNTIME_SUBNET:-}
      PROXY_RUNTIME_IP: ${PROXY_RUNTIME_IP:-}
      CONTROL_PLANE_IPV4: ${CONTROL_PLANE_IPV4:-}
      MODELS_GATEWAY_IPV4: ${MODELS_GATEWAY_IPV4:-}
      DNS_RESOLVER_IPV4: ${DNS_RESOLVER_IPV4:-}
    extra_hosts:
      - ${MANAGED_NODE_SERVER_HOST:-host.docker.internal}:host-gateway
    # The daemon, not workload containers, owns host firewall policy. Host netns
    # is required for DOCKER-USER rules to affect sibling service containers.
    network_mode: host
    working_dir: ${MANAGED_NODE_STATE_DIR:?Set MANAGED_NODE_STATE_DIR to an absolute host path}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MANAGED_NODE_STATE_DIR:?Set MANAGED_NODE_STATE_DIR to an absolute host path}:${MANAGED_NODE_STATE_DIR:?Set MANAGED_NODE_STATE_DIR to an absolute host path}
      - ${MANAGED_NODE_TLS_CA_PATH:-/dev/null}:/run/dofe-agent-tls-ca.pem:ro
    user: ${MANAGED_NODE_USER:-0:0}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "dofe-agent-daemon", "status", "--json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
