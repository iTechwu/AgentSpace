server {
    listen 80;
    server_name dofe-agent.local.dofe.ai;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dofe-agent.local.dofe.ai;

    # Use a certificate trusted by the deployment host. Local development can
    # generate this pair with mkcert for dofe-agent.local.dofe.ai.
    ssl_certificate     /etc/dofe-agent/certs/dofe-agent.local.dofe.ai.pem;
    ssl_certificate_key /etc/dofe-agent/certs/dofe-agent.local.dofe.ai-key.pem;
    client_max_body_size 64m;

    # DofeAgent API routes are served by the same Next.js process so browser
    # requests remain same-origin at https://dofe-agent.local.dofe.ai/api/.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:1455;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:1455;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
